#####################################################
# configuration yaml for mo_hybrid_interactions.smk #
#####################################################

# location of the genotype files
genotype_prefix_template: "/groups/umcg-franke-scrna/tmp02/projects/sc-eqtlgen-consortium-pipeline/ongoing/wg3/wg3_multiome/genotype_input/EUR_imputed_hg38_varFiltered_chr{chrom}"
# base location of chunks
chunk_base: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/cre_detection/limix_sc/input/L1/CD4T/"
# location to store chunk outputs
results_base: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/cre_detection/limix_sc/output/tf_interaction/CD4T/"
# absolute confinement file loc
confinement: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/cre_detection/limix_sc/output/tf_interaction/mo_var_tf_gene_confinement.tsv.gz"
# absolute smf file loc
smf: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/cre_detection/limix_sc/input/L1/CD4T/smf.tsv.gz"
# absolute covariates file loc
covariates: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/metadata/mo_celllevel_metadata.tsv.gz"
# barcode column in covariate file
barcode_column: "barcode_lane"
# fixed effects to consider
fixed_effects: "region,genotype"
# random effects to consider
random_effects: "sample_final,lane"
# terms that interact
interaction_terms: "genotype,region"
# do gaussnorm on expression data
expression_gausnorm: true
# do gausnorm on accessibility data
accessibility_gausnorm: true
# path to expression file
expression_filename: "expression.tsv.gz"
# path to accessibility file
accessibility_filename: "/groups/umcg-franke-scrna/tmp02/projects/multiome/ongoing/scenicplus_workdir/scplus_pipeline_merged_major_and_minor_celltypes/output/eregulon_gene_auc_CD4T_nonsparse_transposed.tsv.gz"

# R command
r_command: "~/start_Rscript.sh"
# script location
script_loc: "/groups/umcg-franke-scrna/tmp02/users/umcg-roelen/singularity/rstudio-server/simulated_home/mo_hybrid_cre_interaction.R"